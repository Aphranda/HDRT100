[pytest]
testpaths =
    tests/python
    tests/hil
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Keep pytest's temporary tree inside the workspace output tree. The default
# Windows temp root is ACL-restricted on some development hosts and can fail
# before collection; out/ is ignored by git.
addopts = -ra --basetemp=out/pytest
markers =
    unit: host-side unit tests that do not require target hardware
    hil: hardware-in-the-loop tests; require --run-hil and --hil-port
