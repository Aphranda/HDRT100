[pytest]
testpaths =
    tests/python
    tests/hil
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Keep pytest's temporary tree and cache inside one workspace output tree. The
# default Windows temp root is ACL-restricted on some development hosts and
# can fail before collection; out/ is ignored by git. Keep the active basetemp
# below a dedicated run directory so archived legacy trees are never removed by
# pytest's basetemp cleanup.
addopts = -ra --basetemp=out/pytest/runs
markers =
    unit: host-side unit tests that do not require target hardware
    hil: hardware-in-the-loop tests; require --run-hil and --hil-port
