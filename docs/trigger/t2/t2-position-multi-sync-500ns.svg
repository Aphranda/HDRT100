<?xml version="1.0" encoding="UTF-8"?>
<!--
  T2 位置多路同步：SWITCH_A 切 8 通道 → SWITCH_B 切 2 极化 → GATEWAY 发 TRIG / 收 READY → 网分。
  单项时序按三块板画三条独立轴（A 板 / B 板 / GATEWAY+网分），因为每块板的时长都各自可配：
  两块开关的稳定时间不必相同，触发提前量是相对“两块都稳定”之后计的。
  标注：中文名 + 单字母代号（A..G），不使用 t_xxx 下标。网分响应实际约 8 ms。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1200" viewBox="0 0 1520 1200"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#33415c"/></marker>
    <style>
      .t  { font-size: 23px; font-weight: 600; fill: #0f172a; }
      .s  { font-size: 13.5px; fill: #475569; }
      .h  { font-size: 15.5px; font-weight: 600; fill: #0f172a; }
      .l  { font-size: 12.5px; fill: #1e293b; }
      .m  { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 12px; fill: #0f172a; }
      .ms { font-family: Consolas, 'Cascadia Mono', monospace; font-size: 11px; fill: #334155; }
      .n  { font-size: 11px; fill: #64748b; }
      .band{ fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; rx: 12; }
      .k  { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .code{ font-family: Consolas, 'Cascadia Mono', monospace; font-size: 11px; fill: #1e293b; }
      .track{ font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1520" height="1200" fill="#ffffff"/>
  <text class="t" x="34" y="38">T2 位置多路同步：A 切通道 → B 切极化 → GATEWAY TRIG/READY → 网分</text>
  <text class="s" x="34" y="60">每次切换与每次触发都落在<strong>预设位置</strong>；三块板的时长各自可配；网分响应实际约 8 ms</text>

  <!-- ============ ① topology ============ -->
  <rect class="band" x="34" y="76" width="1452" height="112"/>
  <text class="h" x="52" y="100">① 一次测量项里谁做什么</text>
  <g>
    <rect x="62" y="108" width="292" height="56" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" rx="8"/>
    <text class="m" x="76" y="128" fill="#9a3412">SWITCH_A · 8 通道</text>
    <text class="ms" x="76" y="146" fill="#9a3412">选 1 通道，在预设片切换；稳定 A</text>

    <rect x="372" y="108" width="292" height="56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" rx="8"/>
    <text class="m" x="386" y="128" fill="#1e40af">SWITCH_B · 2 极化</text>
    <text class="ms" x="386" y="146" fill="#1e40af">H / V，在预设片切换；稳定 B</text>

    <rect x="682" y="108" width="352" height="56" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" rx="8"/>
    <text class="m" x="696" y="128" fill="#166534">GATEWAY · TRIG 输出 / READY 输入</text>
    <text class="ms" x="696" y="146" fill="#166534">提前量 C、脉宽 D、等窗 F</text>

    <rect x="1052" y="108" width="410" height="56" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4" rx="8"/>
    <text class="m" x="1066" y="128" fill="#334155">网分 · TRIG 输入 / READY 输出</text>
    <text class="ms" x="1066" y="146">收到 TRIG 后扫描 E ≈ 8 ms，完成后拉 READY</text>
  </g>
  <g class="ms" fill="#166534">
    <text x="1038" y="122">→ TRIG</text>
    <text x="1038" y="158">← READY</text>
  </g>
  <text class="n" x="52" y="180">16 项 = 8 通道 × 2 极化（可配）；每项：A 定通道、B 定极化 → GATEWAY 发 1 次 TRIG（进网分）→ 网分扫描完拉 1 次 READY（回 GATEWAY）；16 对一一对应。</text>

  <!-- ============ ② config ============ -->
  <rect class="band" x="34" y="204" width="1452" height="190"/>
  <text class="h" x="52" y="230">② 配置项（每项一个名字 + 一个代号）</text>
  <g class="l">
    <text x="56" y="254">代号</text><text x="110" y="254">名称</text><text x="280" y="254">归属 / 作用</text>
    <text x="760" y="254">代号</text><text x="814" y="254">名称</text><text x="984" y="254">归属 / 作用</text>
  </g>
  <g class="code">
    <text x="56" y="278">A</text><text x="110" y="278" fill="#9a3412">A 板稳定</text><text x="280" y="278">SWITCH_A 切换后等稳定</text>
    <text x="56" y="300">B</text><text x="110" y="300" fill="#1e40af">B 板稳定</text><text x="280" y="300">SWITCH_B 切换后等稳定</text>
    <text x="56" y="322">C</text><text x="110" y="322" fill="#166534">触发提前量</text><text x="280" y="322">两块都稳定 → TRIG 的间隔</text>
    <text x="56" y="344">D</text><text x="110" y="344" fill="#166534">触发脉宽</text><text x="280" y="344">GATEWAY TRIG 高电平宽度</text>
    <text x="56" y="366">E</text><text x="110" y="366">网分响应</text><text x="280" y="366">网分扫描/响应（≈8 ms 实际值）</text>
    <text x="56" y="388">F</text><text x="110" y="388" fill="#166534">等回复窗</text><text x="280" y="388">等 READY 的超时窗</text>
    <text x="56" y="386"></text>

    <text x="760" y="278">G</text><text x="814" y="278" fill="#475569">转台移动</text><text x="984" y="278">位置之间移动（无动作，实测填入）</text>
    <text x="760" y="300">N通道</text><text x="814" y="300">通道数</text><text x="984" y="300">默认 8</text>
    <text x="760" y="322">N极化</text><text x="814" y="322">极化数</text><text x="984" y="322">默认 2（H/V）</text>
    <text x="760" y="344">N项</text><text x="814" y="344">每位置项数</text><text x="984" y="344">N通道 × N极化</text>
    <text x="760" y="366">G网格</text><text x="814" y="366">网格片</text><text x="984" y="366">500 ns 仅画图预设，可配</text>
    <text x="760" y="388">Δ项</text><text x="814" y="388">项周期</text><text x="984" y="388">max(A,B) + C + D + E + F</text>
  </g>
  <text class="n" x="52" y="408">A 与 B 是两块板各自的稳定时间，不要求相同；Δ位置 = N项 × Δ项 + G。</text>

  <!-- ============ ③ three axes ============ -->
  <rect class="band" x="34" y="412" width="924" height="360"/>
  <text class="h" x="52" y="438">③ 单项三条轴（A 板 / B 板 / GATEWAY+网分；按 E≈8 ms 画）</text>

  <!-- axis 1: SWITCH_A -->
  <text class="track" x="52" y="470" fill="#9a3412">SWITCH_A</text>
  <line x1="140" y1="466" x2="930" y2="466" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="176" y1="448" x2="176" y2="484" stroke="#c2410c" stroke-width="2.6"/>
  <text class="ms" x="146" y="444" fill="#9a3412">预设片：切通道</text>
  <rect x="176" y="458" width="70" height="16" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="3"/>
  <text class="k" x="200" y="471" fill="#9a3412">A</text>
  <text class="ms" x="256" y="471" fill="#64748b">（之后空闲，等下一次切换）</text>

  <!-- axis 2: SWITCH_B -->
  <text class="track" x="52" y="512" fill="#1e40af">SWITCH_B</text>
  <line x1="140" y1="508" x2="930" y2="508" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="176" y1="490" x2="176" y2="526" stroke="#1d4ed8" stroke-width="2.6"/>
  <text class="ms" x="186" y="486" fill="#1e40af">同一预设片：切极化</text>
  <rect x="176" y="500" width="56" height="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2" rx="3"/>
  <text class="k" x="196" y="513" fill="#1e40af">B</text>

  <!-- axis 3: GATEWAY + VNA -->
  <text class="track" x="52" y="566" fill="#166534">GATEWAY</text>
  <line x1="140" y1="562" x2="930" y2="562" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#a)"/>
  <!-- wait for both settles: C starts after max(A,B) which is drawn at x=252 -->
  <rect x="232" y="554" width="50" height="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.1" rx="3"/>
  <text class="k" x="248" y="566" fill="#475569">C</text>
  <line x1="282" y1="544" x2="282" y2="580" stroke="#15803d" stroke-width="2.6"/>
  <text class="ms" x="238" y="540" fill="#166534">预设片：TRIG↑</text>
  <rect x="282" y="554" width="34" height="16" fill="#dcfce7" stroke="#15803d" stroke-width="1.2" rx="3"/>
  <text class="k" x="290" y="566" fill="#166534">D</text>
  <line x1="316" y1="544" x2="316" y2="580" stroke="#15803d" stroke-width="2.0"/>
  <text class="ms" x="300" y="596" fill="#166534">TRIG↓</text>

  <!-- VNA track -->
  <text class="track" x="52" y="640">网分</text>
  <line x1="140" y1="636" x2="930" y2="636" stroke="#cbd5e1" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="316" y1="628" x2="316" y2="652" stroke="#1d4ed8" stroke-width="2.2"/>
  <text class="ms" x="300" y="664" fill="#1e40af">收到 TRIG</text>
  <rect x="316" y="628" width="470" height="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.3" rx="4"/>
  <text class="k" x="500" y="641" fill="#1e40af">E ≈ 8 ms（扫描/响应）</text>
  <line x1="786" y1="620" x2="786" y2="652" stroke="#15803d" stroke-width="2.6"/>
  <text class="ms" x="742" y="614" fill="#166534">拉 READY↑</text>
  <rect x="786" y="628" width="118" height="16" fill="#dcfce7" stroke="#15803d" stroke-width="1.3" rx="4"/>
  <text class="k" x="812" y="641" fill="#166534">F 等窗</text>
  <line x1="904" y1="620" x2="904" y2="652" stroke="#33415c" stroke-width="2.2"/>
  <text class="ms" x="852" y="614">下一动作预设片</text>
  <rect x="904" y="628" width="26" height="16" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3" rx="4"/>
  <text class="ms" x="936" y="641" fill="#9a3412">动作 k+1 的切换 →</text>

  <g class="l">
    <text x="52" y="678">Δ项 = max(A, B) + C + D + E + F；F 很小——它就是“READY 之后到下一动作预设片”的间隙。</text>
    <text x="52" y="700">按 E ≈ 8 ms 推算：Δ项 ≈ 8.05 ms；16 项 ≈ 128.8 ms；加 G=200 ms ⇒ 位置 ≈ 328.8 ms（随配置变）</text>
    <text x="52" y="722">最后一项之后进入 G 移动窗口：移动期不排任何动作（安装期校验拒绝）</text>
    <text x="52" y="744" class="n">TRIG/READY 是**一对**：GATEWAY 的 TRIG 输出接网分 TRIG 输入；网分的 READY 输出接 GATEWAY READY 输入。每项 1 对，共 16 对。</text>
    <text x="52" y="764" class="n">踩踏判据：READY↑ 必须早于下一动作的预设片；落在该片之后 ⇒ 本动作失败、下一动作不执行（不重试、不当作已执行）。</text>
  </g>

  <!-- ============ ④ 16 items ============ -->
  <rect class="band" x="974" y="412" width="512" height="360"/>
  <text class="h" x="992" y="438">④ 一个位置 = 16 个相同动作（同一张三轴图重复 16 次）</text>
  <g>
    <rect x="992" y="456" width="56" height="44" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="4"/>
    <rect x="1050" y="456" width="56" height="44" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="4"/>
    <rect x="1108" y="456" width="56" height="44" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="4"/>
    <rect x="1166" y="456" width="56" height="44" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="4"/>
    <rect x="1224" y="456" width="56" height="44" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="4"/>
    <rect x="1282" y="456" width="56" height="44" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="4"/>
    <rect x="1340" y="456" width="56" height="44" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2" rx="4"/>
    <rect x="1398" y="456" width="56" height="44" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6" rx="4"/>
  </g>
  <g class="ms">
    <text x="998" y="474">it0</text><text x="998" y="490">ch1·H</text>
    <text x="1056" y="474">it1</text><text x="1056" y="490">ch1·V</text>
    <text x="1114" y="474">it2</text><text x="1114" y="490">ch2·H</text>
    <text x="1172" y="474">it3</text><text x="1172" y="490">ch2·V</text>
    <text x="1230" y="474">…</text><text x="1230" y="490">…</text>
    <text x="1288" y="474">it14</text><text x="1288" y="490">ch8·H</text>
    <text x="1346" y="474">it15</text><text x="1346" y="490">ch8·V</text>
    <text x="1404" y="474">→G</text>
  </g>
  <g class="l">
    <text x="992" y="528">16 个动作流程完全相同：切换 A → 切换 B → TRIG → E → READY↑</text>
    <text x="992" y="550">只有两处不同：A 的通道码、B 的极化码（其余时序一致）</text>
    <text x="992" y="572">动作 k 与 k+1 之间只有 F 这一点间隙 ⇒ 挨着下一个动作</text>
    <text x="992" y="598">每位置 16 对 TRIG/READY 一一对应：</text>
    <text x="992" y="618">少一次＝位置不完整，多一次＝不确定</text>
    <text x="992" y="644">每个动作的三条轴都相对“动作起点”：</text>
    <text x="992" y="664">动作起点 = 位置 base + k × Δ项</text>
    <text x="992" y="690" class="n">（黄框＝最后一个动作，之后进入 G 移动窗口）</text>
  </g>

  <!-- ============ ⑤ mapping ============ -->
  <rect class="band" x="34" y="786" width="1452" height="176"/>
  <text class="h" x="52" y="812">⑤ 落到实现（已提交 + 待完成）</text>
  <g class="ms">
    <text x="56"  y="838">组表：N项 组 × [code, delay]（code 含 A 通道位段 / B 极化位）</text>
    <text x="56"  y="860">delay₀ = (base − now) − 5；delayₖ = Δ项 − 7（指令预算）</text>
    <text x="56"  y="882">base = 该位置时间片（共同时间轴）⇒ 所有切换/触发都是“预设位置”</text>
    <text x="56"  y="904">stage_sequence() 一次交出整条序列；FIFO 4 字＝2 组在飞，排空续填</text>
    <text x="56"  y="926">GATEWAY：脉宽字 D + delay；READY 由 GATEWAY 单独捕获并计数</text>
  </g>
  <g class="ms">
    <text x="800" y="838">已提交：sync_io_sequence_plan / stage_sequence / 三组宿主用例</text>
    <text x="800" y="860">已提交：接收时间戳 rx_local_tick / rx_stale_count（台架 stamps≈14.5k, stale 0）</text>
    <text x="800" y="882">待完成：runtime 一次交出 N 组（“已交出窗口” s_group_handed）</text>
    <text x="800" y="904">待完成：GATEWAY 侧 stage_sequence 同构（脉宽版）</text>
    <text x="800" y="926">待完成：单板台架实测 Δ项 / TRIG→READY 对齐</text>
  </g>
  <text class="n" x="56" y="952">证据口径：图中时长是配置与推算；验收必须用台架实测（单板间隔 + 四板链），二者不得混用。</text>

  <!-- ============ legend ============ -->
  <rect class="band" x="34" y="974" width="1452" height="196"/>
  <text class="h" x="52" y="1000">不变量</text>
  <g class="l">
    <text x="52" y="1024">1. 切换与 TRIG 落在“预设位置”：相对项起点的固定片偏移；软件延迟不得改变相对间隔。</text>
    <text x="52" y="1046">2. A、B 是两块板各自的稳定时间，独立配置；C 从 max(A,B) 起算，谁慢谁决定。</text>
    <text x="52" y="1068">3. 每位置 N项 次 TRIG、等量 READY 一一对应；缺一＝不完整，多一＝不确定，均不计“已完成”。</text>
    <text x="52" y="1090">4. G 填实测值（转台速度变化 ⇒ G 变，位置周期随之变）；移动窗口内不得有动作目标，安装期拒绝。</text>
    <text x="52" y="1112">5. 改任一配置项只改排布（组表 delay 与下一位置 base），不改执行器代码。</text>
    <text x="52" y="1134">6. READY 是证据时刻，可落在网格之间，不为“对齐好看”而吸附。</text>
    <text x="52" y="1156" class="n">契约：docs/trigger/t2/TRIGGER_T2_ARCHITECTURE.md §T2-SEQ-TRANSPORT；执行器：components/sync_io/src/sync_io_sequence_plan.c</text>
  </g>
</svg>
