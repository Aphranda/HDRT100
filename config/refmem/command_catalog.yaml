    allowed_states: [0]
    required_capabilities: 0
    idempotent: false
    timeout_us: 0

  # N6 online domain configuration.  TDMA is the non-stop bearer: its ring
  # topology/period stay deployment-time, while seat rotation and load mask
  # are online-safe.  DPLL is online through request/generation.  VDC and T2
