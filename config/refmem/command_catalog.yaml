version: 1
# REFMEM command catalog: one row per SCPI control command that the unified
# control plane can carry.  This is the single source of truth; the C table is
# generated by tools/refmem/refmem_command_catalog_gen.py.
#
# Fields:
#   id / name / scpi          identity and the original SCPI entry
#   command_type              refmem_command_type_t name
#   owner                     executing domain (owner AO)
#   realtime                  true = RefMem only delivers, core1/owner executes
#   param_words               0..16 numeric words carried inline (64 B block)
#   param_kind                inline | ref (ref = TLV/staging payload)
#   params                    per-word semantic names (documentation + tools)
#   allowed_states            bitmask of allowed run states (0 = any)
#   required_capabilities     capability bits required on the target
#   idempotent                duplicate command_seq is safe
#   timeout_us                0 = no timeout
commands:
  - id: 1
    name: REFMEM_LOAD_BOARD
    scpi: "SYSTem:REFMEM:LOAD:BOARD"
    command_type: BOARD_CAPABILITY_STAGE
    owner: REFMEM
    realtime: false
    param_words: 9
    param_kind: inline
    params:
      [board_id, board_uuid_crc32, capability_mask, io_constraint_mask,
       ip_core_mask, default_persona_mask, hw_profile_crc32,
       active_default_slot, online_required]
    allowed_states: [0]
    required_capabilities: 0
    idempotent: true
    timeout_us: 0

  - id: 2
    name: REFMEM_LOAD_NODE
    scpi: "SYSTem:REFMEM:LOAD:NODE"
    command_type: NODE_LOAD_STAGE
    owner: REFMEM
    realtime: false
    param_words: 7
    param_kind: inline
    params:
      [node_id, instance_id, role_mask, persona_mask, enabled, required,
       load_order]
    allowed_states: [0]
    required_capabilities: 0
    idempotent: true
    timeout_us: 0

  - id: 3
    name: REFMEM_LOAD_SD
    scpi: "SYSTem:REFMEM:LOAD:SD"
    command_type: TABLE_PACKAGE_STAGE
    owner: REFMEM
    realtime: false
    param_words: 4
    param_kind: inline
    params: [package_crc32, package_size, manifest_schema, flags]
    allowed_states: [0]
    required_capabilities: 0
    idempotent: true
    timeout_us: 0

  - id: 4
    name: REFMEM_MAINTENANCE_SELF_CHECK
    scpi: "SYSTem:REFMEM:MAINTenance:SELFcheck"
    command_type: MAINTENANCE
    owner: REFMEM
    realtime: false
    param_words: 1
    param_kind: inline
    params: [check_mask]
    allowed_states: [0]
    required_capabilities: 0
    idempotent: true
    timeout_us: 0
